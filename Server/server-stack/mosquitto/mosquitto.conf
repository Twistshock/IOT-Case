# 17683 - Dag 2 reference configuration
#
# The broker listens on all interfaces INSIDE the container.
# compose.yaml publishes the port only on 127.0.0.1 of the Debian host.
# Remote access / authentication is introduced later with the BeaglePlay bridge.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
