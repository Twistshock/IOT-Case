[agent]
  interval = "10s"
  flush_interval = "2s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]

  # TODO 1:
  # Vælg det topic-filter, der skal modtage processed weather-data.
  # Brug systemets topic-struktur og testscriptet som dokumentation.
  topics = ["gateways/+/weather"]

  topic_tag = "mqtt_topic"
  qos = 0
  startup_error_behavior = "retry"

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "weather"

    # TODO 2:
    # Vælg JSON path og format for measurement-tidspunktet.
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    # TODO 3:
    # Vælg de to værdier i JSON'en, der beskriver kilden til målingen.
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "gateway_id"

    # TODO 4:
    # Map de tre numeriske vejrmålinger til float fields.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature_c"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humidity_pct"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pressure_hpa"
      type = "float"

[[outputs.postgresql]]
  startup_error_behavior = "retry"

  # TODO 5:
  # Forbind til PostgreSQL-servicen i Compose-netværket.
  # Brug service-navn og værdier fra environment/.env – ikke hardcodede passwords.
  connection = "host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"

  timestamp_column_name = "time"
  timestamp_column_type = "timestamp with time zone"
